[package]
name = "remote-sim"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Test program that acts as the Remote and tests the driver with a real receiver"
publish = false

# Not part of the driver build.
[workspace]

[dependencies]
denon-marantz = { git = "https://github.com/henrikwidlund/rusty-denon-marantz", rev = "00d7987c3436ff7b35a2ec63e062487adc0bd726", default-features = false, features = ["telnet", "http", "serde"] }
denon-marantz-heos = { git = "https://github.com/henrikwidlund/rusty-denon-marantz", rev = "00d7987c3436ff7b35a2ec63e062487adc0bd726" }
jiff = { version = "1", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = "0.30.0"
