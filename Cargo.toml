[package]
name = "uc-intg-denonmarantz"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MPL-2.0"
description = "Denon and Marantz receiver integration for Unfolded Circle Remote Two/3"
authors = ["Henrik Widlund"]
publish = false

[features]
default = ["mdns-sd"]
# mDNS service publishing. The Remote needs it to find the driver.
# Pure Rust, works on all platforms and in cross builds.
mdns-sd = ["dep:mdns-sd"]
# Trace logs with the full telnet and HEOS lines. They can hold titles and account names: only
# for tests, never in a release.
sensitive-logs = ["denon-marantz/sensitive-logs"]
# Allocation tests. They run alone:
# `cargo test --locked --features dhat-heap dhat_ -- --ignored --test-threads=1`.
dhat-heap = ["dep:dhat"]

[dependencies]
uc_api = { git = "https://github.com/unfoldedcircle/api-model-rs", rev = "336beb1" }
denon-marantz = { git = "https://github.com/henrikwidlund/rusty-denon-marantz", rev = "ea05b457474b15d521a80e99e22cd126ac818bf8", features = ["mdns", "serde", "heos"] }

# WebSocket server
actix = "0"
actix-web = { version = "4", default-features = false, features = ["macros"] }
actix-ws = "0"
futures = { version = "0", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
tokio-stream = { version = "0", features = ["sync"] }

# mDNS publishing
hostname = "0"

# JSON (de)serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rust-fsm = "0"
const_format = "0"
strum = { version = "0", features = ["derive"] }
thiserror = "2"
jiff = { version = "1", default-features = false, features = ["serde", "std"] }
bytestring = "1"
uuid = { version = "1", features = ["v4"] }

# Logging. The library logs with tracing. The driver and other crates log with `log`: tracing-log
# forwards these records to the tracing subscriber.
tracing = { version = "0", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0", default-features = false, features = ["env-filter", "fmt", "parking_lot", "smallvec", "tracing-log"] }
tracing-log = { version = "0", default-features = false, features = ["log-tracer", "std"] }
log = "0"
mdns-sd = { version = "0", optional = true }
# Only for tests. A feature cannot turn on a dev-dependency.
dhat = { version = "0", optional = true }

[build-dependencies]
built = { version = "0", features = ["cargo-lock"] }

[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
unwrap_used = "warn"
# Conflicts with the `unreachable_pub` lint.
redundant_pub_crate = "allow"
# `mul_add` is slow on CPUs without FMA.
suboptimal_flops = "allow"
# Duplicates come from dependencies.
multiple_crate_versions = "allow"
# Reports guards that are already dropped at the end of their block.
significant_drop_tightening = "allow"
# Needs `repository` and other fields that are not set.
cargo_common_metadata = "allow"
# The driver runs on one thread (actix), so futures do not need to be `Send`.
future_not_send = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Method paths of the library enums are longer than the closures.
redundant_closure_for_method_calls = "allow"
# Actix handlers take messages by value.
needless_pass_by_value = "allow"

# Full LTO and one codegen unit give the smallest binary for the Remote. The native and Docker
# builds use thin LTO, see .github/workflows/build.yml and Dockerfile.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

[dev-dependencies]
# The fake receiver of the tests.
tokio = { version = "1.54.1", features = ["io-util", "net", "rt"] }
